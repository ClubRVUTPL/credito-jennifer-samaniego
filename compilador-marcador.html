<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compilador del marcador</title>
    <!--
      Herramienta SOLO de desarrollo (no forma parte del build de producción).
      Compila public/ar/placa-cara-qr.jpg + placa-cara-texto.jpg a targets.mind
      (dos caras del mismo marcador físico) usando el compilador de mind-ar.
      Instrucciones completas: scripts/compilar-marcador.md
    -->
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      img {
        max-width: 100%;
        border: 1px solid #ccc;
        margin: 0.5rem 0;
      }
      .caras {
        display: grid;
        gap: 1rem;
      }
      .caras figure {
        margin: 0;
      }
      .caras figcaption {
        font-size: 0.9rem;
        color: #444;
      }
      #salida {
        white-space: pre-wrap;
        background: #f4f4f4;
        padding: 1rem;
        border-radius: 8px;
      }
      a.descarga {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.6rem 1rem;
        background: #1a66d0;
        color: #fff;
        border-radius: 8px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>Compilador del marcador (2 caras)</h1>
    <p>
      Lee <code>public/ar/placa-cara-qr.jpg</code> y
      <code>public/ar/placa-cara-texto.jpg</code>, los compila con el
      compilador del paquete <code>mind-ar</code> y descarga
      <code>targets.mind</code> (un solo fichero con ambos targets).
    </p>
    <div id="imagen" class="caras"></div>
    <p id="salida">Cargando las imágenes…</p>
    <div id="descarga"></div>

    <script type="module">
      import 'mind-ar/dist/mindar-image.prod.js';

      const salida = document.querySelector('#salida');
      const zonaImagen = document.querySelector('#imagen');
      const zonaDescarga = document.querySelector('#descarga');

      function log(texto) {
        salida.textContent = texto;
      }

      async function cargarImagen(url) {
        const img = new Image();
        img.src = url;
        await img.decode();
        return img;
      }

      function contarPuntos(data) {
        let matching = 0;
        let tracking = 0;
        (data.matchingData || []).forEach((nivel) => {
          matching += (nivel.maximaPoints || []).length;
          matching += (nivel.minimaPoints || []).length;
        });
        (data.trackingData || []).forEach((nivel) => {
          tracking += (nivel.points || []).length;
        });
        return { matching, tracking };
      }

      function mostrarCara(img, etiqueta) {
        const fig = document.createElement('figure');
        const cap = document.createElement('figcaption');
        cap.textContent = etiqueta;
        fig.appendChild(cap);
        fig.appendChild(img);
        zonaImagen.appendChild(fig);
      }

      async function main() {
        let imgQr;
        let imgTexto;
        try {
          imgQr = await cargarImagen('/ar/placa-cara-qr.jpg');
        } catch {
          log(
            'No existe public/ar/placa-cara-qr.jpg (o no es una imagen válida).\n' +
              'Coloca ahí la cara QR de la placa y recarga esta página.'
          );
          window.__errorCompilacion = 'falta public/ar/placa-cara-qr.jpg';
          return;
        }
        try {
          imgTexto = await cargarImagen('/ar/placa-cara-texto.jpg');
        } catch {
          log(
            'No existe public/ar/placa-cara-texto.jpg (o no es una imagen válida).\n' +
              'Coloca ahí la cara de texto de la placa y recarga esta página.'
          );
          window.__errorCompilacion = 'falta public/ar/placa-cara-texto.jpg';
          return;
        }

        mostrarCara(imgQr, 'Cara QR — /ar/placa-cara-qr.jpg');
        mostrarCara(imgTexto, 'Cara texto — /ar/placa-cara-texto.jpg');

        const compiler = new window.MINDAR.IMAGE.Compiler();
        log('Compilando… 0 %');
        const dataList = await compiler.compileImageTargets(
          [imgQr, imgTexto],
          (progreso) => {
            log(`Compilando… ${progreso.toFixed(0)} %`);
          }
        );

        const porTarget = dataList.map((data, i) => {
          const pts = contarPuntos(data);
          return { index: i, ...pts };
        });
        const matching = porTarget.reduce((s, t) => s + t.matching, 0);
        const tracking = porTarget.reduce((s, t) => s + t.tracking, 0);

        const detalle = porTarget
          .map(
            (t) =>
              `  Target ${t.index} (${t.index === 0 ? 'QR' : 'texto'}): matching=${t.matching}, tracking=${t.tracking}`
          )
          .join('\n');

        log(
          `Compilación terminada (${dataList.length} targets).\n` +
            `${detalle}\n` +
            `Total matching: ${matching}\n` +
            `Total tracking: ${tracking}\n\n` +
            `Orientación: por debajo de ~100 puntos de detección por cara el marcador será poco fiable;\n` +
            `busca una imagen con más contraste, texto y detalle no repetitivo.`
        );

        const buffer = await compiler.exportData();

        const bytes = new Uint8Array(buffer);
        let binario = '';
        for (let i = 0; i < bytes.length; i += 32768) {
          binario += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
        }
        window.__resultadoCompilacion = {
          matching,
          tracking,
          targets: dataList.length,
          porTarget,
          base64: btoa(binario),
        };

        const blob = new Blob([buffer], { type: 'application/octet-stream' });
        const enlace = document.createElement('a');
        enlace.className = 'descarga';
        enlace.href = URL.createObjectURL(blob);
        enlace.download = 'targets.mind';
        enlace.textContent = 'Descargar targets.mind';
        zonaDescarga.appendChild(enlace);
      }

      main();
    </script>
  </body>
</html>
